name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install python dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: DEBUG diagnostics (temporary)
        shell: python
        run: |
          import sys, os
          print("sys.executable=", sys.executable)
          print("cwd=", os.getcwd())
          print("PYTHONPATH env=", os.environ.get("PYTHONPATH"))
          print("sys.path=", sys.path)
          print("backend/__init__.py exists=", os.path.exists(os.path.join(os.getcwd(), "backend", "__init__.py")))
          print("backend dir listing=", os.listdir(os.path.join(os.getcwd(), "backend")) if os.path.isdir("backend") else "NO BACKEND DIR")
          try:
              import backend
              print("import backend OK, file=", backend.__file__)
          except Exception as e:
              print("import backend FAILED:", repr(e))
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run pytest
        run: pytest backend/tests
        env:
          PYTHONPATH: ${{ github.workspace }}

  dotnet-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore dotnet/CspAnalyzer.sln

      - name: Build
        run: dotnet build dotnet/CspAnalyzer.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test dotnet/CspAnalyzer.sln --configuration Release --no-build
