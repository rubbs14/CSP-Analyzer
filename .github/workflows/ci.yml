name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install python dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run pytest
        run: pytest backend/tests
        env:
          PYTHONPATH: ${{ github.workspace }}

  dotnet-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install python backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Resolve python interpreter path
        shell: pwsh
        run: |
          $pythonPath = python -c "import sys; print(sys.executable)"
          "CSP_ANALYZER_PYTHON=$pythonPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore dotnet/CspAnalyzer.sln

      - name: Build
        run: dotnet build dotnet/CspAnalyzer.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test dotnet/CspAnalyzer.sln --configuration Release --no-build

  package:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            os-name: linux
          - os: windows-latest
            rid: win-x64
            os-name: windows
          - os: macos-latest
            rid: osx-x64
            os-name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install python dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Freeze python backend with PyInstaller
        working-directory: backend
        run: pyinstaller csp-backend.spec --noconfirm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained desktop app
        run: dotnet publish dotnet/CspAnalyzer.Desktop/CspAnalyzer.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained

      - name: Assemble package
        shell: pwsh
        run: ./scripts/package/package.ps1 -Rid ${{ matrix.rid }} -OsName ${{ matrix.os-name }}

      - uses: actions/upload-artifact@v4
        with:
          name: CspAnalyzer-${{ matrix.os-name }}-${{ matrix.rid }}
          path: artifacts/CspAnalyzer-${{ matrix.os-name }}-${{ matrix.rid }}.zip

      - name: Install rpm build tools
        if: matrix.os-name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm imagemagick
          sudo gem install --no-document fpm

      - name: Resolve rpm version
        if: matrix.os-name == 'linux'
        shell: bash
        run: |
          RAW_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0-dev")
          # rpm's Version field can't contain "-" (reserved for the
          # Version-Release separator) - replace with "." so a fallback
          # "0.0.0-dev" or an annotated tag like "v2.0.1-rc1" both produce
          # a valid rpm version string.
          RPM_VERSION=$(echo "$RAW_VERSION" | sed 's/^v//' | tr '-' '.')
          echo "RPM_VERSION=$RPM_VERSION" >> "$GITHUB_ENV"

      - name: Build rpm package
        if: matrix.os-name == 'linux'
        shell: pwsh
        env:
          RPM_VERSION: ${{ env.RPM_VERSION }}
        run: ./scripts/package/package-rpm.ps1 -Version $env:RPM_VERSION

      - name: Verify rpm is well-formed
        if: matrix.os-name == 'linux'
        run: |
          rpm -qlp artifacts/*.rpm
          rpm -qip artifacts/*.rpm

      - name: Verify rpm installs cleanly
        if: matrix.os-name == 'linux'
        run: |
          docker run --rm -v ${{ github.workspace }}/artifacts:/artifacts rockylinux:9 bash -c "
            rpm -i /artifacts/*.rpm &&
            test -x /opt/csp-analyzer/CspAnalyzer.Desktop &&
            test -x /opt/csp-analyzer/csp-backend/csp-backend &&
            test -x /usr/bin/csp-analyzer &&
            test -f /usr/share/applications/csp-analyzer.desktop &&
            test -f /usr/share/icons/hicolor/256x256/apps/csp-analyzer.png
          "

      - name: Upload rpm artifact
        if: matrix.os-name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: CspAnalyzer-linux-rpm
          path: artifacts/*.rpm

      - name: Resolve installer version
        if: matrix.os-name == 'windows'
        shell: pwsh
        run: |
          $rawVersion = git describe --tags --abbrev=0 2>$null
          if (-not $rawVersion) { $rawVersion = "v0.0.0-dev" }
          $global:LASTEXITCODE = 0
          $installerVersion = $rawVersion -replace '^v', '' -replace '-', '.'
          "INSTALLER_VERSION=$installerVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Windows installer
        if: matrix.os-name == 'windows'
        shell: pwsh
        env:
          INSTALLER_VERSION: ${{ env.INSTALLER_VERSION }}
        run: ./scripts/package/package-installer.ps1 -Version $env:INSTALLER_VERSION

      - name: Verify installer installs cleanly
        if: matrix.os-name == 'windows'
        shell: pwsh
        env:
          INSTALLER_VERSION: ${{ env.INSTALLER_VERSION }}
        run: |
          $installerPath = "artifacts\CspAnalyzer-Setup-$env:INSTALLER_VERSION.exe"
          $process = Start-Process -FilePath $installerPath -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "installer exited with code $($process.ExitCode)" }

          $installDir = Join-Path $env:LOCALAPPDATA "CspAnalyzer"
          if (-not (Test-Path (Join-Path $installDir "CspAnalyzer.Desktop.exe"))) {
              throw "app exe missing after install"
          }
          if (-not (Test-Path (Join-Path $installDir "csp-backend\csp-backend.exe"))) {
              throw "backend exe missing after install"
          }
          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\CSP Analyzer\CSP Analyzer.lnk"
          if (-not (Test-Path $shortcut)) {
              throw "Start Menu shortcut missing after install"
          }
          $uninstallKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{D6B0EA6C-E5EC-4259-B860-3D199A86A829}_is1"
          if (-not (Test-Path $uninstallKey)) {
              throw "uninstall registry key missing after install"
          }

      - name: Verify installer uninstalls cleanly
        if: matrix.os-name == 'windows'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:LOCALAPPDATA "CspAnalyzer"
          $uninstaller = Join-Path $installDir "unins000.exe"
          Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait

          # Inno's uninstaller copies itself to %TEMP% and relaunches so it
          # can delete its own running exe - the original process (the one
          # -Wait blocks on) can exit before that copy finishes deleting
          # $installDir. Poll instead of trusting -Wait alone.
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path $installDir) -and (Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 1
          }
          if (Test-Path $installDir) {
              throw "install dir still present after uninstall (timed out waiting)"
          }
          $uninstallKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{D6B0EA6C-E5EC-4259-B860-3D199A86A829}_is1"
          if (Test-Path $uninstallKey) {
              throw "uninstall registry key still present after uninstall"
          }

      - name: Upload installer artifact
        if: always() && matrix.os-name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: CspAnalyzer-windows-installer
          path: artifacts/CspAnalyzer-Setup-*.exe
