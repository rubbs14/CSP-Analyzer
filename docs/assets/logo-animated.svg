<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" width="1280" height="220" fill="none" role="img" aria-label="CSP-Analyzer">
  <style>
    .field { opacity: 1; }
    .el { opacity: 0; }
    .chosen, .ringO, .ringM, .ringI { transform-box: fill-box; transform-origin: center; }
    .axes  { stroke: #2E6BE6; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 120; }
    .bound { stroke: #2E6BE6; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 80; }
    .inactive, .chosen { fill: #2E6BE6; }
    .ring  { stroke: #00A297; stroke-linecap: round; }
    .ringO { stroke-width: 2.5; } .ringM { stroke-width: 2.8; } .ringI { stroke-width: 3.1; }

    /* play once, hold on the final mark */
    .axes     { animation: axes     4.4s ease            forwards; }
    .inactive { animation: inactive 4.4s ease            forwards; }
    .bound    { animation: bound    4.4s ease            forwards; }
    .chosen   { animation: chosen   4.4s cubic-bezier(.5,0,.2,1)  forwards; }
    .ringO    { animation: ringO    4.4s cubic-bezier(.2,.7,.2,1) forwards; }
    .ringM    { animation: ringM    4.4s cubic-bezier(.2,.7,.2,1) forwards; }
    .ringI    { animation: ringI    4.4s cubic-bezier(.2,.7,.2,1) forwards; }
    .wm       { animation: wmFade   4.4s ease            forwards; }

    @keyframes axes {
      0%{opacity:0; stroke-dashoffset:120} 4%{opacity:.4} 18%{opacity:.4; stroke-dashoffset:0}
      47%{opacity:.4} 58%{opacity:0} 100%{opacity:0}
    }
    @keyframes inactive {
      0%{opacity:0; transform:scale(0)} 13%{opacity:.9; transform:scale(1)}
      47%{opacity:.9; transform:scale(1)} 58%{opacity:0; transform:scale(.35)} 100%{opacity:0}
    }
    @keyframes bound {
      0%,21%{opacity:0; stroke-dashoffset:80} 27%{opacity:.5} 41%{opacity:.5; stroke-dashoffset:0}
      54%{opacity:.5} 64%{opacity:0} 100%{opacity:0}
    }
    @keyframes chosen {
      0%{opacity:0; transform:translate(0px,0px) scale(0); fill:#2E6BE6}
      11%{opacity:1; transform:translate(0px,0px) scale(1); fill:#2E6BE6}
      45%{transform:translate(0px,0px) scale(1); fill:#2E6BE6}
      61%{transform:translate(-14px,16px) scale(1.4); fill:#00A297}
      100%{opacity:1; transform:translate(-14px,16px) scale(1.4); fill:#00A297}
    }
    @keyframes ringO { 0%,57%{opacity:0; transform:scale(0)} 72%{opacity:.3; transform:scale(1)} 100%{opacity:.3; transform:scale(1)} }
    @keyframes ringM { 0%,61%{opacity:0; transform:scale(0)} 76%{opacity:.55; transform:scale(1)} 100%{opacity:.55; transform:scale(1)} }
    @keyframes ringI { 0%,65%{opacity:0; transform:scale(0)} 81%{opacity:1; transform:scale(1)} 100%{opacity:1; transform:scale(1)} }
    @keyframes wmFade { 0%,62%{opacity:0} 78%{opacity:1} 100%{opacity:1} }

    @media (prefers-reduced-motion: reduce) {
      .el,.wm{ animation:none; }
      .axes,.inactive,.bound{ opacity:0; }
      .ringO{opacity:.3} .ringM{opacity:.55} .ringI{opacity:1}
      .wm{opacity:1}
      .chosen{ opacity:1; transform:translate(-14px,16px) scale(1.4); fill:#00A297; }
    }
  </style>

  <g class="field">
    <!-- animated mark (0..100 art), larger, as a centred horizontal lockup -->
    <g transform="translate(320,10) scale(2.0)">
      <path class="el axes" d="M22 20 V80 H80"/>
      <circle class="el inactive" cx="32" cy="62" r="3"/>
      <circle class="el inactive" cx="44" cy="68" r="3"/>
      <circle class="el inactive" cx="26" cy="52" r="2.6"/>
      <circle class="el inactive" cx="66" cy="58" r="2.8"/>
      <circle class="el inactive" cx="40" cy="44" r="2.6"/>
      <circle class="el inactive" cx="58" cy="72" r="2.6"/>
      <line class="el bound" x1="22" y1="78" x2="80" y2="24"/>
      <g transform="rotate(-20 50 50)">
        <ellipse class="el ring ringO" cx="50" cy="50" rx="31" ry="25"/>
        <ellipse class="el ring ringM" cx="50" cy="50" rx="21" ry="16.5"/>
        <ellipse class="el ring ringI" cx="50" cy="50" rx="11.5" ry="9"/>
      </g>
      <circle class="el chosen" cx="64" cy="34" r="3.4"/>
    </g>

    <!-- wordmark -->
    <g class="wm" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif">
      <text x="536" y="118" font-size="60" font-weight="700" letter-spacing="-1" fill="#2E6BE6">CSP<tspan fill="#8A93A8">-Analyzer</tspan></text>
      <text x="539" y="149" font-size="16.5" font-weight="600" letter-spacing="5.5" fill="#8A93A8">NMR FRAGMENT SCREENING</text>
    </g>
  </g>
</svg>
